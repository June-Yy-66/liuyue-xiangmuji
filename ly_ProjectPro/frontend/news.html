<!DOCTYPE html>
<!--
  姓名：刘悦 | 学号：24002120220
  时间：2026-11-20 | 大模型：GLM-5.3-Flash
  功能名称：科技新闻列表页面
  功能说明：展示后端接口链接（GET /api/news），并通过该接口从
            MySQL 数据库 ly_news 表读取新闻数据渲染成列表
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>科技新闻列表 - 刘悦的项目集</title>
  <link rel="stylesheet" href="css/ly_news.css">
</head>
<body>
  <main class="ly_main">
    <a class="ly_back" href="index.html">← 返回首页</a>

    <section class="ly_card">
      <h1 class="ly_title">科技新闻列表</h1>
      <p class="ly_desc">新闻数据存储于 MySQL 数据库 ly_news 表，通过后端接口获取</p>

      <!-- 后端接口链接展示 -->
      <div class="ly_api_bar">
        <span class="ly_api_label">后端接口：</span>
        <a class="ly_api_link" id="ly_api_link" href="/api/news" target="_blank">GET /api/news</a>
        <button class="ly_refresh_btn" id="ly_refresh_btn" type="button">刷新</button>
      </div>

      <!-- 数据加载状态与错误提示 -->
      <div class="ly_status ly_hide" id="ly_status"></div>

      <!-- 新闻列表容器 -->
      <ul class="ly_news_list" id="ly_news_list"></ul>
    </section>
  </main>

  <script src="js/ly_news.js"></script>
</body>
</html>
