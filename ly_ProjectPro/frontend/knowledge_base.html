<!DOCTYPE html>
<!--
  姓名：刘悦 | 学号：24002120220
  时间：2026-11-25 | 大模型：GLM-5.3-Flash
  功能名称：知识库问答页面（RAG）
  功能说明：三大模块——① 知识库文件上传（支持 txt/md/pdf/doc/docx/pptx，10MB 内）；
            ② 知识库文件管理（列表、删除）；③ 基于知识库的智能问答（后端检索
            相关分块交给七牛大模型生成答案并返回引用来源）。服务器返回的数据
            和错误信息均输出到浏览器控制台
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识库问答 - 刘悦的项目集</title>
  <link rel="stylesheet" href="css/ly_knowledge_base.css">
</head>
<body>
  <main class="ly_main">
    <a class="ly_back" href="index.html">← 返回首页</a>

    <!-- 模块一：文件上传 -->
    <section class="ly_card">
      <h1 class="ly_title">知识库问答（RAG）</h1>
      <p class="ly_desc">上传文档构建专属知识库，提问时自动检索相关内容交给大模型回答。支持 txt / md / pdf / doc / docx / pptx，单个文件 10MB 以内。</p>

      <div class="ly_upload_area" id="ly_upload_area">
        <input type="file" id="ly_file_input" accept=".txt,.md,.pdf,.doc,.docx,.pptx,.ppt" hidden>
        <div class="ly_upload_icon">📄</div>
        <p class="ly_upload_text" id="ly_upload_text">点击选择或拖拽文件到此处上传</p>
        <button class="ly_upload_btn" id="ly_upload_btn" type="button">选择文件上传</button>
      </div>
      <div class="ly_status ly_hide" id="ly_upload_status"></div>
    </section>

    <!-- 模块二：知识库文件管理 -->
    <section class="ly_card">
      <div class="ly_card_head">
        <h2 class="ly_sub_title">知识库文件管理</h2>
        <button class="ly_refresh_btn" id="ly_refresh_btn" type="button">刷新列表</button>
      </div>
      <div class="ly_status ly_hide" id="ly_list_status"></div>
      <ul class="ly_file_list" id="ly_file_list"></ul>
    </section>

    <!-- 模块三：知识库问答 -->
    <section class="ly_card">
      <div class="ly_card_head">
        <h2 class="ly_sub_title">知识库智能问答</h2>
        <span class="ly_api_text">POST /api/kb/ask</span>
      </div>

      <div class="ly_chat_box" id="ly_chat_box">
        <div class="ly_msg ly_msg_ai">知识库就绪后，问我与知识库内容相关的问题吧，例如：“这个网站有哪些功能页面？”</div>
      </div>

      <div class="ly_status ly_hide" id="ly_ask_status"></div>

      <footer class="ly_input_bar">
        <input type="text" class="ly_input" id="ly_input" placeholder="输入问题，Enter 发送">
        <button class="ly_send_btn" id="ly_send_btn" type="button">提问</button>
      </footer>
    </section>
  </main>

  <script src="js/ly_knowledge_base.js"></script>
</body>
</html>
