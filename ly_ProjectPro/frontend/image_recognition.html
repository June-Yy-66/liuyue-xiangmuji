<!DOCTYPE html>
<!--
  姓名：刘悦 | 学号：24002120220
  时间：2026-11-25 | 大模型：GLM-5.3-Flash
  功能名称：图像识别页面
  功能说明：上传图片（jpg/png/webp/gif，5MB 内）后由后端调用硅基流动视觉
            大模型（Qwen3-VL）识别并返回图片描述；支持上传预览、识别中状态、
            成功与失败提示；服务器返回的数据和错误信息均输出到浏览器控制台
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图像识别 - 刘悦的项目集</title>
  <link rel="stylesheet" href="css/ly_image_recognition.css">
</head>
<body>
  <main class="ly_main">
    <a class="ly_back" href="index.html">← 返回首页</a>

    <section class="ly_card">
      <h1 class="ly_title">图像识别</h1>
      <p class="ly_desc">上传一张图片，视觉大模型（Qwen3-VL）将为你生成图片描述。支持 jpg / png / webp / gif，5MB 以内。接口：<span class="ly_api_text">POST /api/vision/recognize</span></p>

      <!-- 上传与预览区 -->
      <div class="ly_upload_row">
        <div class="ly_upload_area" id="ly_upload_area">
          <input type="file" id="ly_file_input" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
          <div class="ly_upload_icon">🖼️</div>
          <p class="ly_upload_text" id="ly_upload_text">点击选择或拖拽图片到此处</p>
          <button class="ly_upload_btn" id="ly_upload_btn" type="button">选择图片</button>
        </div>
        <div class="ly_preview_area" id="ly_preview_area">
          <img class="ly_preview_img ly_hide" id="ly_preview_img" alt="图片预览">
          <p class="ly_preview_tip" id="ly_preview_tip">图片预览区</p>
        </div>
      </div>

      <div class="ly_status ly_hide" id="ly_status"></div>

      <!-- 识别结果 -->
      <div class="ly_result ly_hide" id="ly_result">
        <div class="ly_result_head">📝 识别结果</div>
        <p class="ly_result_text" id="ly_result_text"></p>
      </div>
    </section>
  </main>

  <script src="js/ly_image_recognition.js"></script>
</body>
</html>
